<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOO</title>
    <!-- استدعاء مكتبة الأيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* إعدادات عامة للصفحة */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #050505;
        }

        /* فيديو الخلفية */
        #bg-video {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            z-index: -1;
            object-fit: cover;
            filter: brightness(0.3); /* تعتيم الفيديو قليلاً ليظهر النص واللوجو بوضوح */
        }

        /* حاوية المحتوى بالمنتصف */
        .profile-container {
            text-align: center;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-top: -50px;
        }

        /* صورة اللوجو */
        .profile-pic {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.8);
        }

        /* تصميم الاسم: تخين، أحمر، متوهج، ويختفي ويظهر */
        .username {
            font-size: 3.5rem;
            font-weight: 900; /* خط تخين جداً */
            color: #ff0000;
            text-shadow: 0 0 10px #ff0000, 0 0 25px #ff0000, 0 0 45px #ff0000; /* توهج أحمر */
            animation: blinker 1s infinite; /* أنيميشن يشتغل كل ثانية */
            letter-spacing: 2px;
        }

        @keyframes blinker {
            0% { opacity: 1; }
            50% { opacity: 0; } /* يختفي في منتصف الثانية */
            100% { opacity: 1; }
        }

        /* صندوق أزرار السوشيال ميديا الشفاف (Glassmorphism) */
        .social-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            padding: 15px 35px;
            border-radius: 25px;
            display: flex;
            gap: 25px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* أزرار السوشيال ميديا */
        .social-card a {
            color: white;
            font-size: 2.2rem;
            text-decoration: none;
            transition: transform 0.3s ease, text-shadow 0.3s ease;
        }

        .social-card a:hover {
            transform: scale(1.15);
            text-shadow: 0 0 15px white;
        }

        /* عداد المشاهدات بأسفل اليسار */
        .view-counter {
            position: absolute;
            bottom: 30px;
            left: 30px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
        }

        /* زر تشغيل/إيقاف الموسيقى */
        .audio-toggle-btn {
            position: absolute;
            top: 25px;
            right: 25px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 18px;
            border-radius: 12px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            z-index: 10;
            font-size: 1rem;
            transition: 0.3s;
            display: none;
        }
        
        .audio-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <!-- زر التحكم بالصوت -->
    <button class="audio-toggle-btn" id="audioBtn" onclick="toggleAudio()">
        <i class="fas fa-volume-mute"></i> تشغيل الموسيقى
    </button>

    <!-- فيديو الخلفية -->
    <video id="bg-video" autoplay loop playsinline>
        <source src="VEDIO1.mp4" type="video/mp4">
    </video>

    <div class="profile-container">
        <!-- صورة اللوجو -->
        <img src="lojo.png" alt="JOO" class="profile-pic" onerror="this.src='lojo.jpg'">
        
        <!-- الاسم المتوهج والمتحرك -->
        <h1 class="username">JOO</h1>

        <!-- الأزرار مع الروابط الخاصة بك -->
        <div class="social-card">
            <a href="https://www.youtube.com/@YOUSSEF__3BDO3357" target="_blank" title="YouTube"><i class="fab fa-youtube"></i></a>
            <a href="https://discord.gg/KMETMYxKey" target="_blank" title="Discord"><i class="fab fa-discord"></i></a>
            <a href="https://www.instagram.com/joo_33561" target="_blank" title="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="https://www.tiktok.com/@joo3356ff" target="_blank" title="TikTok"><i class="fab fa-tiktok"></i></a>
        </div>
    </div>

    <!-- عداد المشاهدات الحقيقي -->
    <div class="view-counter">
        <i class="fas fa-eye"></i> <span id="views-count">...</span>
    </div>

    <script>
        // إعدادات تشغيل موسيقى الفيديو تلقائياً
        const video = document.getElementById('bg-video');
        const audioBtn = document.getElementById('audioBtn');
        
        video.muted = false; 
        let playPromise = video.play();

        if (playPromise !== undefined) {
            playPromise.then(_ => {
                audioBtn.style.display = 'block';
                audioBtn.innerHTML = '<i class="fas fa-volume-up"></i> إيقاف الموسيقى';
            }).catch(error => {
                video.muted = true;
                video.play();
                audioBtn.style.display = 'block';
            });
        }

        // دالة زر كتم وتشغيل الصوت
        function toggleAudio() {
            if (video.muted) {
                video.muted = false;
                audioBtn.innerHTML = '<i class="fas fa-volume-up"></i> إيقاف الموسيقى';
            } else {
                video.muted = true;
                audioBtn.innerHTML = '<i class="fas fa-volume-mute"></i> تشغيل الموسيقى';
            }
        }

        // --- سكريبت العداد الحقيقي (Global View Counter) ---
        const counterElement = document.getElementById('views-count');
        
        // استخدام API مجاني يحفظ الرقم ويجمعه لكل الزوار
        // تم استخدام اسم مخصص لموقعك "joo-x-cheat-site" عشان يكون العداد خاص بيك انت بس
        fetch('https://api.counterapi.dev/v1/joo-x-cheat-site/visits/up')
            .then(response => response.json())
            .then(data => {
                // عرض عدد الزيارات الحقيقي اللي راجع من السيرفر
                counterElement.innerText = data.count;
            })
            .catch(error => {
                console.error('Error fetching counter:', error);
                // في حالة فشل الاتصال بالإنترنت أو السيرفر، بيظهر رقم احتياطي
                counterElement.innerText = "1";
            });
    </script>
</body>
</html>
